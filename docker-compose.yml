version: '3.8'

# ★★★ 应用版本号 ★★★
# 版本号的唯一声明处就在本文件：镜像 tag 与后端容器内的 APP_VERSION 保持一致，
# 升级时改这里即可（本地直跑后端时，后端会直接读本项目根目录的 docker-compose.yml 兜底）。

services:
  # ========== 前端 ==========
  frontend:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: monday1/mdcgs-frontend:v1.1.5
    container_name: mdcgs-frontend
    restart: unless-stopped
    ports:
      - "7785:80"
    depends_on:
      - backend
    networks:
      - mdcgs-network

  # ========== 后端（从 DockerHub 拉取）==========
  backend:
    image: monday1/mdcgs-backend:v1.1.5
    container_name: mdcgs-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ★★★ 应用版本（开放接口 /health、/docs 返回的 version 取自此变量）★★★
      - APP_VERSION=v1.1.5
      # ★★★ MySQL 配置 ★★★
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DATABASE_URL=mysql+pymysql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      # ★★★ Redis 配置 ★★★
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      # ★★★ 安全 ★★★
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPT_KEY=${ENCRYPT_KEY}
    volumes:
      - backend_data:/app/data
      - backend_plugin:/app/plugin
    networks:
      - mdcgs-network

networks:
  mdcgs-network:
    driver: bridge

volumes:
  backend_data:
  backend_plugin: